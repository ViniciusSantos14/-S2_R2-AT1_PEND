<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista Dinâmica</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="width: 400px;">
    <h4 class="text-center mb-3">Adicionar item</h4>

    <div class="input-group">
      <input type="text" id="inputItem" class="form-control" placeholder="Digite algo">
      <button id="btnAdd" class="btn btn-success">
        Adicionar
      </button>
    </div>

    <ul id="lista" class="list-group mt-3"></ul>
  </div>

  <script src="script.js"></script>

</body>
</html>
